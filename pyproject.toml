[project]
name = "Dota2Bot"
version = "0.1.0"
description = "Steam bot that follows streamers through its friend list and reports what they are doing in Dota 2"
readme = "README.md"
requires-python = ">=3.14"
# The runtime dependencies of `src/shared` have to be here too, see its `pyproject.toml`.
dependencies = [
    "aiohttp",
    "asyncpg",
    "click>=8.5.0",
    "discord-py[speed]",
    "fastapi[standard-no-fastapi-cloud-cli]",
    "loguru>=0.8.0",
    "lru-dict>=1.4.1",
    "orjson",
    "pydantic-settings",
    "pygit2>=1.21.0",
    "python-dateutil>=2.9.0.post0",
    "steamio",
    "uvloop>=0.23.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["asyncpg-stubs", "pytest", "ty", "ruff"]

[tool.uv.sources]
steamio = { git = "https://github.com/Aluerie/steam.py", rev = "main" }


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ty.src]
exclude = ["src/shared/tests"] # the submodule's own tests run in its own CI

[tool.ty.rules]
all = "error"
dynamic-function-decorator-return = "ignore"
possibly-missing-import = "ignore"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"
unsound-yield = "ignore"


[tool.ruff]
line-length = 120
target-version = "py314"
preview = true
exclude = [
    ".venv",
    "src/shared/tests",
] # the submodule's own tests run in its own CI
src = ["src"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Recommended to disable by https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "incorrect-blank-line-before-class",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "multi-line-implicit-string-concatenation",
    # Docstring related
    "D",
    "DOC",
    # Complexity memes
    "complex-structure",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-statements-in-try-clause",
    # Todo
    "line-contains-todo",
    "missing-todo-author",
    "missing-todo-link",
    # Other (uncategorized) Rules
    "ambiguous-unicode-character-string",
    "any-type",
    "assert",
    "commented-out-code",
    "implicit-namespace-package",
    "magic-value-comparison",
    "no-self-use",
    "non-empty-init-module",
    "undefined-local-with-import-star",
    "undefined-local-with-import-star-usage",
    # Loguru formats messages with `{}`, these rules expect the `%` style of the standard `logging`
    "logging-too-few-args",
    "logging-too-many-args",
]
unfixable = []
# `logger.exception` of loguru counts as handling the exception, e.g. for `blind-except`
logger-objects = ["loguru.logger"]
flake8-quotes.inline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"{src/ext/beta.py,templates/fresh_beta.py,src/xi.py,*.ipynb}" = [
    # These files are my playground to mess around and test stuff.
    "ANN",
    "D",
    "missing-copyright-notice",
    "print",
    "unused-method-argument",
    "unused-noqa",
]
"src/ext/*.py" = [
    "undocumented-param", # I don't want to document all the `ctx: IreContext`
]
"tests/*.py" = [
    "hardcoded-password-string", # fake secrets
    "private-member-access",     # tests poke at internals on purpose
    "unused-method-argument",    # test doubles mirror the signatures they replace
    "unused-async",              # test doubles of async functions have to be async
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
