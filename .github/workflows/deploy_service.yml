name: Deploy and Restart

on:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # a throwaway PostgreSQL for tests/test_sql.py
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout IreBot's migrations
        uses: actions/checkout@v6
        with:
          repository: Aluerie/IrenesBot
          path: .deps/IreBot
          sparse-checkout: migrations
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Typecheck
        run: uv run ty check .
      - name: Test
        run: uv run pytest
        env:
          SQL_CHECK_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
          IREBOT_MIGRATIONS: .deps/IreBot/migrations

  deploy:
    # a broken commit must not reach the server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Restarting the bot
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ./Dota2Bot
            git pull --ff-only
            git submodule update --init --recursive
            ~/.local/bin/uv sync --locked --no-dev
            # the unit file is a symlink to the repo's dota2bot.service, so this picks up any changes to it
            sudo systemctl daemon-reload
            sudo systemctl restart dota2bot.service
