name: Deploy and Restart

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Restarting the bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ./Dota2Bot
            git pull
            git submodule update --init --recursive
            ~/.local/bin/uv sync --no-dev
            sudo systemctl restart dota2bot.service
            sudo systemctl start dota2bot.service
