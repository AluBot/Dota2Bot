name: Deploy and Restart

on:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Typecheck
        run: uv run ty check .
      - name: Test
        run: uv run pytest

  deploy:
    # a broken commit must not reach the server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Restarting the bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ./Dota2Bot
            git pull
            git submodule update --init --recursive
            ~/.local/bin/uv sync --locked --no-dev
            sudo systemctl restart dota2bot.service
